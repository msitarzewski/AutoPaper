name: Website

# Builds site/ (plus PRIVACY.md and NETWORK.md) with scripts/build_site.py and publishes it to GitHub Pages, as
# AudioPaper's does. The Mac's update feed, Sparkle's appcast (written by scripts/release.sh), is served from here too;
# pushing it republishes the site. Windows' App Installer file and the Linux Flatpak repository are on msitarzewski.com.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - site/static/appcast.xml
      - PRIVACY.md
      - NETWORK.md
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Build
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5