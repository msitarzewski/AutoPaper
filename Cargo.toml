[workspace]
resolver = "3"
members = ["core", "cli", "uniffi-bindgen", "apps/linux"]
# apps/linux joins the workspace when it exists; it needs GTK headers, so it isn't a default member on macOS/Windows.
default-members = ["core", "cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/msitarzewski/AutoPaper"

[workspace.dependencies]
# Pinned: uniffi-bindgen-cs v0.11.0+v0.31.0 supports the 0.31 metadata contract only (docs/research/rust-linux.md).
uniffi = "=0.31.2"
autopaper-core = { path = "core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Dependencies (image codecs and resizing, candle, SQLite) are optimised in dev and test builds too:
# unoptimised, they make the engine's tests and `autopaper simulate` many times slower. The workspace's own
# crates stay unoptimised for debugging.
[profile.dev.package."*"]
opt-level = 2
