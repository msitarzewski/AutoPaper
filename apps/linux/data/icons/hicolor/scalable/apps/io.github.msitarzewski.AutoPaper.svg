<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- AutoPaper's app icon in GNOME's style (128 × 128, front view, flat shapes with a little depth, colours from
       the GNOME palette). Derived from docs/icon/Sources/display: the display's bezel, red screen and stand, and the
       Heroicons "sparkles" (MIT, see THIRD-PARTY-NOTICES.md) centred on the screen. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="18" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="screen" x1="16" y1="26" x2="112" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ed333b"/>
      <stop offset="1" stop-color="#a51d2d"/>
    </linearGradient>
    <linearGradient id="inset" x1="0" y1="26" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="94" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="102" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>
  <!-- Stand: neck, then the foot with its darker front edge. -->
  <rect x="56" y="92" width="16" height="14" fill="url(#neck)"/>
  <rect x="36" y="104" width="56" height="10" rx="4" fill="#9a9996"/>
  <rect x="36" y="101" width="56" height="9" rx="4" fill="url(#foot)"/>
  <!-- Bezel: the darker bottom edge gives it depth, as GNOME's app icons do. -->
  <rect x="8" y="22" width="112" height="74" rx="8" fill="#9a9996"/>
  <rect x="8" y="18" width="112" height="74" rx="8" fill="url(#bezel)"/>
  <!-- Screen, recessed: a shadowed rim, then the red screen. -->
  <rect x="14" y="24" width="100" height="62" rx="4" fill="url(#inset)"/>
  <rect x="15.5" y="25.5" width="97" height="59" rx="3" fill="url(#screen)"/>
  <!-- Sparkles (Heroicons, solid, v2.2.0), scaled to ~60% of the screen's height. -->
  <g transform="translate(64 55) scale(1.75) translate(-12 -12)">
    <path fill="#ffffff" fill-rule="evenodd" d="M9 4.5a.75.75 0 0 1 .721.544l.813 2.846a3.75 3.75 0 0 0 2.576 2.576l2.846.813a.75.75 0 0 1 0 1.442l-2.846.813a3.75 3.75 0 0 0-2.576 2.576l-.813 2.846a.75.75 0 0 1-1.442 0l-.813-2.846a3.75 3.75 0 0 0-2.576-2.576l-2.846-.813a.75.75 0 0 1 0-1.442l2.846-.813A3.75 3.75 0 0 0 7.466 7.89l.813-2.846A.75.75 0 0 1 9 4.5ZM18 1.5a.75.75 0 0 1 .728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 0 1 0 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 0 1-1.456 0l-.258-1.036a2.625 2.625 0 0 0-1.91-1.91l-1.036-.258a.75.75 0 0 1 0-1.456l1.036-.258a2.625 2.625 0 0 0 1.91-1.91l.258-1.036A.75.75 0 0 1 18 1.5ZM16.5 15a.75.75 0 0 1 .712.513l.394 1.183c.15.447.5.799.948.948l1.183.395a.75.75 0 0 1 0 1.422l-1.183.395c-.447.15-.799.5-.948.948l-.395 1.183a.75.75 0 0 1-1.422 0l-.395-1.183a1.5 1.5 0 0 0-.948-.948l-1.183-.395a.75.75 0 0 1 0-1.422l1.183-.395c.447-.15.799-.5.948-.948l.395-1.183A.75.75 0 0 1 16.5 15Z"/>
  </g>
</svg>
