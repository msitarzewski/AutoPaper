[package]
name = "autopaper-core"
description = "AutoPaper's agent: keywords → concepts → wallpapers, with memory, echoes and taste."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "autopaper_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
async-trait = "0.1"
base64 = "0.22"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
image_hasher = "3.1.1"
rand = "0.9"
reqwest = { version = "0.13.5" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0.21"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# ComfyUI's /ws progress events (plain ws:// to local servers only; the TCP connection is the core's own).
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false }
tracing = "0.1.44"
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "net", "io-util"] }
