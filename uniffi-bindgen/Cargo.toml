[package]
name = "uniffi-bindgen"
description = "UniFFI's binding generators, at the same version as the core (Swift: uniffi-bindgen-swift)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/uniffi-bindgen-swift.rs"
